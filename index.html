<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyAuth Panel</title>
<style>
:root{
  --bg:#0c0e12;--side:#11141a;--panel:#151920;--panel2:#1b2029;--line:#242a35;--line2:#303847;
  --text:#e7eaf0;--mute:#8791a3;--dim:#5c6678;
  --red:#e5484d;--red2:#c93a3f;--ok:#46c97d;--warn:#f0b13a;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.5 var(--sans);min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}

/* Connexion */
#login{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:
  radial-gradient(600px 300px at 50% 0,rgba(229,72,77,.10),transparent),var(--bg);z-index:50}
.lbox{width:100%;max-width:370px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px 28px}
.lbox h1{font-size:18px;font-weight:700;margin-bottom:4px}
.lbox p{color:var(--mute);margin-bottom:22px}
.lbox input{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;outline:none}
.lbox input:focus,.fld input:focus,.fld select:focus,.tb input:focus,.tb select:focus{border-color:var(--red)}
.err{color:var(--red);font-size:12.5px;margin-top:12px}

/* Mise en page */
#app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:4px 10px 20px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--red);display:grid;place-items:center;font-style:normal;font-size:13px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;color:var(--mute);font-weight:600;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 var(--red)}
.nav small{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.bottom{margin-top:auto}
main{padding:26px 30px 50px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1.t{font-size:20px;font-weight:700;letter-spacing:-.2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{padding:8px 15px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:#455068}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red2)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger:hover{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat span{font-size:12px;color:var(--mute);font-weight:600}
.stat b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--red)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tb{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tb input,.tb select,.fld input,.fld select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;outline:none}
.tb input{flex:1;min-width:200px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;padding:10px 14px;font-size:12px;color:var(--mute);font-weight:600;background:var(--side);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.02)}
.key,.hw{font-family:var(--mono);font-size:12.5px}
.key{color:#ff8f93;cursor:pointer;padding:2px 5px;border-radius:4px}
.key:hover{background:rgba(229,72,77,.12)}
.hw{color:var(--mute)}
.mut{color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.active{color:var(--ok);background:rgba(70,201,125,.1)}
.badge.expired{color:var(--warn);background:rgba(240,177,58,.1)}
.badge.banned{color:var(--red);background:rgba(229,72,77,.1)}
.row{display:flex;gap:6px}
.view{display:none}.view.on{display:block}
.empty{padding:38px 20px;text-align:center;color:var(--dim)}

/* Fenêtre */
.modal{position:fixed;inset:0;background:rgba(4,5,8,.75);display:grid;place-items:center;padding:20px;z-index:60}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:100%;max-width:420px;padding:22px}
.box h2{font-size:17px;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld label{font-size:12.5px;font-weight:600;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.out{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12.5px;color:#ff8f93;max-height:200px;overflow:auto;white-space:pre;margin-bottom:12px}

#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--dim);border-radius:8px;padding:10px 15px;min-width:200px;font-weight:600}
.toast.success{border-left-color:var(--ok)}.toast.error{border-left-color:var(--red)}

@media(max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 10px 0 0}.nav{width:auto;gap:8px;white-space:nowrap}.nav.on{box-shadow:inset 0 -2px var(--red)}
  .bottom{margin:0 0 0 auto}
  main{padding:18px 16px 40px}.stats{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Style & animations ===== */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-12px)}}
@keyframes spin{to{--a:360deg}}
@keyframes orb{to{transform:translate(140px,90px) scale(1.25)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%,100%{box-shadow:0 0 0 6px transparent}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

#login{overflow:hidden}
#login::before,#login::after{content:"";position:absolute;width:440px;height:440px;border-radius:50%;filter:blur(95px);opacity:.28;pointer-events:none}
#login::before{background:var(--red);top:-140px;left:-120px;animation:orb 14s ease-in-out infinite alternate}
#login::after{background:#4a5cff;bottom:-170px;right:-130px;animation:orb 18s ease-in-out infinite alternate-reverse}
.lbox{position:relative;z-index:1;border:1px solid transparent;
  background:linear-gradient(var(--panel),var(--panel)) padding-box,conic-gradient(from var(--a),var(--line) 55%,var(--red) 78%,var(--line)) border-box;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.8);
  animation:spin 5s linear infinite,rise .8s cubic-bezier(.2,.8,.2,1) both}
input{transition:border-color .2s,box-shadow .25s}
input:focus{box-shadow:0 0 0 3px rgba(229,72,77,.16)}

#app:not([hidden]){animation:fade .6s ease}
main{background:radial-gradient(760px 280px at 85% -70px,rgba(229,72,77,.08),transparent)}
.view.on{animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}

.nav{transition:background .25s,color .25s,box-shadow .3s,transform .25s}
.nav:hover{transform:translateX(3px)}
.brand i{box-shadow:0 0 22px -2px rgba(229,72,77,.65)}

.btn{transition:transform .18s,background .25s,border-color .25s,box-shadow .3s,color .25s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.red:hover{box-shadow:0 10px 26px -10px var(--red)}

.stat{transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;
  background:linear-gradient(160deg,rgba(255,255,255,.035),transparent 60%),var(--panel)}
.stat:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 16px 34px -18px rgba(0,0,0,.9)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 120px),var(--panel);box-shadow:0 20px 50px -34px rgba(0,0,0,.9)}

tbody tr{transition:background .25s}
.fresh tr,#hwidBody tr,#logsBody tr{animation:rowIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}
.key{transition:background .2s,color .2s}
.badge.active::before{animation:pulse 2.2s infinite}

.modal{animation:fade .25s ease;backdrop-filter:blur(6px)}
.box{animation:pop .35s cubic-bezier(.2,.9,.3,1.15);box-shadow:0 40px 90px -30px #000}
.toast{animation:toastIn .4s cubic-bezier(.2,.9,.3,1.1);backdrop-filter:blur(8px)}
.toast.out{animation:toastOut .3s ease forwards}

@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important}}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="loginForm">
    <h1>KeyAuth Panel</h1>
    <p>Entre ta clé d'administration pour continuer.</p>
    <input type="password" id="adminKey" placeholder="Clé d'administration" autocomplete="off" aria-label="Clé d'administration">
    <button class="btn red" style="width:100%" id="loginBtn">Se connecter</button>
    <div class="err" id="loginErr" hidden></div>
  </form>
</div>

<div id="app" hidden>
  <aside>
    <div class="brand"><i>🔑</i>KeyAuth</div>
    <button class="nav on" data-view="keys">Licences <small id="nKeys">0</small></button>
    <button class="nav" data-view="hwid">HWID bannis <small id="nHwid">0</small></button>
    <button class="nav" data-view="logs">Logs</button>
    <div class="bottom"><button class="btn ghost" id="logout" style="width:100%">Déconnexion</button></div>
  </aside>

  <main>
    <div class="top">
      <h1 class="t" id="title">Licences</h1>
      <div class="acts">
        <button class="btn ghost" id="refresh">Rafraîchir</button>
        <button class="btn ghost" id="export">Exporter</button>
        <button class="btn red" id="newKey">Nouvelle clé</button>
      </div>
    </div>

    <section class="view on" id="v-keys">
      <div class="stats" id="stats"></div>
      <div class="card">
        <div class="tb">
          <input id="q" type="search" placeholder="Rechercher une clé ou un HWID" aria-label="Rechercher">
          <select id="st" aria-label="Statut">
            <option value="">Tous les statuts</option><option value="active">Actives</option>
            <option value="expired">Expirées</option><option value="banned">Bannies</option>
          </select>
        </div>
        <div class="scroll"><table>
          <thead><tr><th>Clé</th><th>Statut</th><th>Durée</th><th>HWID</th><th>Expire le</th><th>Restant</th><th></th></tr></thead>
          <tbody id="keysBody"></tbody>
        </table></div>
        <div class="empty" id="keysEmpty">Chargement…</div>
      </div>
    </section>

    <section class="view" id="v-hwid">
      <div class="card">
        <div class="tb">
          <input id="newHwid" placeholder="HWID à bannir" aria-label="HWID à bannir">
          <button class="btn danger" id="banHwid">Bannir ce HWID</button>
        </div>
        <div class="scroll"><table>
          <thead><tr><th>HWID banni</th><th>Ajouté le</th><th></th></tr></thead>
          <tbody id="hwidBody"></tbody>
        </table></div>
        <div class="empty" id="hwidEmpty">Chargement…</div>
      </div>
    </section>

    <section class="view" id="v-logs">
      <div class="card">
        <div class="scroll"><table>
          <thead><tr><th>Date</th><th>Type</th><th>Détail</th></tr></thead>
          <tbody id="logsBody"></tbody>
        </table></div>
        <div class="empty" id="logsEmpty">Chargement…</div>
      </div>
    </section>
  </main>
</div>

<div id="toasts"></div>

<script>
/* ---------- Configuration ---------- */
const API_URL = "https://keyauth-api.cacamoussa70.workers.dev";

/* La clé admin n'est jamais écrite dans le code : elle est saisie à la connexion
   et gardée uniquement le temps de la session de l'onglet. */
let adminKey = sessionStorage.getItem('ka_admin') || '';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => new Date(ts).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtLeft = ms => {
  const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.floor(ms%36e5/6e4);
  return d ? `${d}j ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
};
const status = k => k.banned ? 'banned' : Date.now() > k.expiresAt ? 'expired' : 'active';
const names = {active:'Active', expired:'Expirée', banned:'Bannie'};

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast ' + (type || ''); el.textContent = msg;
  $('toasts').appendChild(el); setTimeout(() => el.classList.add('out'), 2500); setTimeout(() => el.remove(), 2800);
}
async function api(path, method = 'GET', body){
  const r = await fetch(API_URL + path, {
    method, headers: {'Content-Type':'application/json','X-Admin-Key':adminKey},
    body: body ? JSON.stringify(body) : undefined
  });
  return r.json();
}

/* ---------- Connexion ---------- */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const v = $('adminKey').value.trim(); if (!v) return;
  $('loginBtn').disabled = true; $('loginErr').hidden = true;
  adminKey = v;
  let msg = '';
  try {
    const res = await fetch(API_URL + '/admin/keys', {headers: {'X-Admin-Key': v}});
    let r = null;
    try { r = await res.json(); } catch {}
    if (res.ok && r && r.ok) { sessionStorage.setItem('ka_admin', v); start(r); }
    else if (res.status === 401 || res.status === 403) msg = 'Clé refusée par l\'API (erreur ' + res.status + '). Utilise la clé admin du Worker, pas l\'ancien mot de passe du panel.';
    else msg = 'Réponse inattendue de l\'API (erreur ' + res.status + (r && r.error ? ' : ' + r.error : '') + ').';
  } catch {
    msg = 'API injoignable. Vérifie l\'adresse du Worker et que le CORS autorise l\'en-tête X-Admin-Key.';
  }
  if (msg) { adminKey = ''; $('loginErr').textContent = msg; $('loginErr').hidden = false; }
  $('loginBtn').disabled = false; $('adminKey').value = '';
});
$('logout').onclick = () => { sessionStorage.removeItem('ka_admin'); location.reload(); };

function start(first){
  $('login').hidden = true; $('app').hidden = false;
  if (first) renderKeys(first.keys || [], true); else loadKeys();
  loadHwids(); loadLogs();
}
if (adminKey) api('/admin/keys').then(r => r.ok ? start(r) : sessionStorage.removeItem('ka_admin')).catch(() => {});

/* ---------- Navigation ---------- */
const titles = {keys:'Licences', hwid:'HWID bannis', logs:'Logs'};
document.querySelectorAll('.nav').forEach(b => b.onclick = () => {
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n === b));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + b.dataset.view));
  $('title').textContent = titles[b.dataset.view];
  $('newKey').hidden = $('export').hidden = b.dataset.view !== 'keys';
});

/* ---------- Licences ---------- */
const prevStat = {};
function countUp(){
  document.querySelectorAll('#stats b').forEach((el, i) => {
    const to = +el.dataset.n, from = prevStat[i] || 0; prevStat[i] = to;
    el.textContent = from;
    if (from === to) return;
    const t0 = performance.now();
    (function f(t){
      const p = Math.min(1, (t - t0) / 800);
      el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(f);
    })(t0);
  });
}
let allKeys = [];
async function loadKeys(){
  try { const r = await api('/admin/keys'); if (!r.ok) throw new Error(r.error); renderKeys(r.keys || [], true); }
  catch(e){ toast('Erreur : ' + e.message, 'error'); $('keysEmpty').textContent = 'Impossible de charger les clés.'; }
}
function renderKeys(list, anim){
  allKeys = list; $('nKeys').textContent = list.length;
  const c = {active:0, expired:0, banned:0}; list.forEach(k => c[status(k)]++);
  $('stats').innerHTML = [['Total',list.length,''],['Actives',c.active,'ok'],['Expirées',c.expired,'warn'],['Bannies',c.banned,'bad']]
    .map(([a,b,cl]) => `<div class="stat"><span>${a}</span><b class="${cl}" data-n="${b}">${b}</b></div>`).join('');

  countUp();
  $('keysBody').classList.toggle('fresh', !!anim);
  queueMicrotask(() => $('keysBody').querySelectorAll('tr').forEach((tr, i) => tr.style.setProperty('--i', Math.min(i, 14))));
  const q = $('q').value.trim().toUpperCase(), fs = $('st').value;
  const rows = list.filter(k => (!fs || status(k) === fs) && (!q || k.key.includes(q) || (k.hwid || '').includes(q)));
  $('keysEmpty').hidden = rows.length > 0;
  $('keysEmpty').textContent = list.length ? 'Aucune clé ne correspond à ta recherche.' : 'Aucune clé pour le moment. Crée-en une avec « Nouvelle clé ».';
  $('keysBody').innerHTML = rows.map(k => {
    const s = status(k);
    return `<tr>
      <td><span class="key" title="Cliquer pour copier" data-copy="${esc(k.key)}">${esc(k.key)}</span></td>
      <td><span class="badge ${s}">${names[s]}</span></td>
      <td class="mut">${esc(k.days || '?')} j</td>
      <td>${k.hwid ? `<span class="hw">${esc(k.hwid)}</span>` : '<span class="mut"><i>libre</i></span>'}</td>
      <td class="mut">${fmtDate(k.expiresAt)}</td>
      <td class="mut">${s === 'active' ? fmtLeft(k.expiresAt - Date.now()) : '—'}</td>
      <td><div class="row">
        <button class="btn ghost sm" data-act="${k.banned ? 'unban' : 'ban'}" data-key="${esc(k.key)}">${k.banned ? 'Débannir' : 'Bannir'}</button>
        <button class="btn ghost sm danger" data-act="del" data-key="${esc(k.key)}">Supprimer</button>
      </div></td></tr>`;
  }).join('');
}
$('keysBody').addEventListener('click', async e => {
  const cp = e.target.closest('[data-copy]');
  if (cp) return navigator.clipboard.writeText(cp.dataset.copy).then(() => toast('Clé copiée', 'success'), () => toast('Copie impossible', 'error'));
  const b = e.target.closest('[data-act]'); if (!b) return;
  const key = b.dataset.key, a = b.dataset.act;
  if (a === 'ban' && !confirm('Bannir ' + key + ' ?')) return;
  if (a === 'del' && !confirm('Supprimer ' + key + ' ?')) return;
  const r = await api({ban:'/admin/ban', unban:'/admin/unban', del:'/admin/delete'}[a], 'POST', {key});
  if (r.ok) { toast({ban:'Clé bannie', unban:'Clé réactivée', del:'Clé supprimée'}[a], 'success'); loadKeys(); loadLogs(); }
  else toast(r.error || 'Erreur', 'error');
});
$('q').oninput = $('st').onchange = () => renderKeys(allKeys);
$('refresh').onclick = () => { loadKeys(); loadHwids(); loadLogs(); };

/* ---------- Nouvelle clé (fenêtre) ---------- */
function modal(html){
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => { m.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => e.key === 'Escape' && close();
  document.addEventListener('keydown', esc_);
  m.addEventListener('mousedown', e => e.target === m && close());
  document.body.appendChild(m); return {m, close};
}
$('newKey').onclick = () => {
  const {m, close} = modal(`
    <h2>Nouvelle clé</h2>
    <div class="two">
      <div class="fld"><label for="nd">Durée</label><select id="nd">
        <option value="3">3 jours</option><option value="7">7 jours</option>
        <option value="30" selected>30 jours</option><option value="365">1 an</option></select></div>
      <div class="fld"><label for="nq">Quantité</label><input id="nq" type="number" min="1" max="100" value="1"></div>
    </div>
    <div class="fld"><label for="nh">HWID (facultatif)</label><input id="nh" placeholder="Laisser vide pour une clé libre"></div>
    <div class="foot"><button class="btn ghost" id="c1">Annuler</button><button class="btn red" id="c2">Créer</button></div>`);
  m.querySelector('#c1').onclick = close;
  m.querySelector('#c2').onclick = async () => {
    const days = +m.querySelector('#nd').value;
    const quantity = Math.max(1, Math.min(100, parseInt(m.querySelector('#nq').value, 10) || 1));
    const hwid = m.querySelector('#nh').value.trim().toUpperCase() || null;
    const r = await api('/admin/keys', 'POST', {days, quantity, hwid, level:'basic'});
    if (!r.ok) return toast(r.error || 'Erreur', 'error');
    close(); loadKeys(); loadLogs();
    const made = (r.created || []).map(x => x.key);
    if (!made.length) return toast(quantity + ' clé(s) créée(s)', 'success');
    const res = modal(`<h2>${made.length} clé(s) créée(s)</h2><div class="out"></div>
      <div class="foot"><button class="btn ghost" id="r1">Fermer</button><button class="btn red" id="r2">Copier tout</button></div>`);
    res.m.querySelector('.out').textContent = made.join('\n');
    res.m.querySelector('#r1').onclick = res.close;
    res.m.querySelector('#r2').onclick = () => navigator.clipboard.writeText(made.join('\n')).then(() => toast('Copié', 'success'));
  };
  m.querySelector('#nq').focus();
};

/* ---------- HWID bannis ---------- */
async function loadHwids(){
  try {
    const r = await api('/admin/hwids'); if (!r.ok) throw new Error();
    const list = (r.hwids || []).sort((a, b) => (b.ts || 0) - (a.ts || 0));
    $('nHwid').textContent = list.length; $('hwidEmpty').hidden = list.length > 0;
    $('hwidEmpty').textContent = 'Aucun HWID banni.';
    $('hwidBody').innerHTML = list.map(h => `<tr>
      <td><span class="hw" style="color:#ff8f93">${esc(h.hwid)}</span></td>
      <td class="mut">${fmtDate(h.ts || Date.now())}</td>
      <td><button class="btn ghost sm" data-h="${esc(h.hwid)}">Retirer</button></td></tr>`).join('');
  } catch { $('hwidEmpty').hidden = false; $('hwidEmpty').textContent = 'Impossible de charger les HWID.'; }
}
$('hwidBody').addEventListener('click', async e => {
  const b = e.target.closest('[data-h]'); if (!b || !confirm('Retirer ce HWID ?\n' + b.dataset.h)) return;
  const r = await api('/admin/hwid/unban', 'POST', {hwid: b.dataset.h});
  if (r.ok) { toast('HWID retiré', 'success'); loadHwids(); loadLogs(); } else toast(r.error || 'Erreur', 'error');
});
async function banHwid(){
  const v = $('newHwid').value.trim().toUpperCase(); if (!v) return toast('Entre un HWID', 'error');
  const r = await api('/admin/hwid/ban', 'POST', {hwid: v});
  if (r.ok) { $('newHwid').value = ''; toast('HWID banni', 'success'); loadHwids(); loadLogs(); } else toast(r.error || 'Erreur', 'error');
}
$('banHwid').onclick = banHwid;
$('newHwid').onkeydown = e => e.key === 'Enter' && banHwid();

/* ---------- Logs ---------- */
const L = {create:['Création','active'], ban:['Ban','banned'], unban:['Déban','active'], delete:['Suppression','expired'],
  'hwid-ban':['HWID banni','banned'], 'hwid-unban':['HWID retiré','active'], export:['Export','active'],
  'auth-ok':['Connexion','active'], 'auth-banned':['Clé bannie','banned'], 'auth-expired':['Clé expirée','expired'],
  'auth-hwid-banned':['HWID banni','banned'], 'auth-hwid-mismatch':['HWID différent','expired'], redeem:['Activation','active']};
async function loadLogs(){
  try {
    const r = await api('/admin/logs'); if (!r.ok) throw new Error();
    const list = r.logs || []; $('logsEmpty').hidden = list.length > 0; $('logsEmpty').textContent = 'Aucun log.';
    $('logsBody').innerHTML = list.map(l => {
      const [lab, cls] = L[l.type] || [l.type, 'active'];
      return `<tr><td class="mut">${fmtDate(l.ts)}</td><td><span class="badge ${cls}">${esc(lab)}</span></td><td>${esc(l.detail)}</td></tr>`;
    }).join('');
  } catch { $('logsEmpty').hidden = false; $('logsEmpty').textContent = 'Impossible de charger les logs.'; }
}

/* ---------- Export ---------- */
$('export').onclick = () => {
  if (!allKeys.length) return toast('Aucune clé à exporter', 'error');
  const lines = allKeys.map(k => [k.key, status(k), (k.days || '?') + 'j', k.hwid || '-', new Date(k.expiresAt).toISOString()].join('|'));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['key|status|days|hwid|expires\n' + lines.join('\n')], {type:'text/plain'}));
  a.download = 'keys_' + Date.now() + '.txt'; a.click(); toast('Export terminé', 'success');
};
</script>
